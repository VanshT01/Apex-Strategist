[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-strategist-api"
version = "0.1.0"
description = "Historical Formula 1 ingestion and API for Apex Strategist"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "fastf1>=3.5,<4",
  "msgpack>=1.2.1,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
